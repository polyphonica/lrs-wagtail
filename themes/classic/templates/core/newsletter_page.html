{% extends "base.html" %}{% load wagtailcore_tags %}
{% block content %}
<div class="wrap narrow section">
  <p class="eyebrow"><a href="{% pageurl page.get_parent %}">Newsletter</a>{% if page.send %} · {{ page.send.started_at|date:"j F Y" }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ page.body|richtext }}</div>
</div>
{% endblock %}
