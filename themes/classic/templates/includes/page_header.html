{% load wagtailimages_tags %}
<header class="page-header{% if page.image %} has-image{% endif %}">
  {% if page.image %}{% picture page.image format-{avif,webp,jpeg} fill-{800x450,1600x700,2400x1000} sizes="100vw" class="page-header-img" alt="" fetchpriority="high" %}{% endif %}
  <div class="wrap page-header-text">
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  </div>
</header>
