# nginx site for the new LRS website. On the server: /etc/nginx/sites-available/zz-lrs, linked from sites-enabled.
# The server hosts other sites, so everything here stays inside this site:
# - the file name sorts last, so this site never becomes the fallback for unknown HTTPS addresses;
# - no options on `listen` (http2, default_server, reuseport...): those apply to every site on the port;
# - the shared names below (zone, map variable) all start with lrs_.
# Check with `nginx -t`, then `systemctl reload nginx` (never restart).
limit_req_zone $binary_remote_addr zone=lrs_login:10m rate=5r/m;
# Newsletter sign-ups send a confirmation email, so posting the form is limited too; reading the page is not
# (requests with an empty key are never limited).
map $request_method $lrs_post_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $lrs_post_key zone=lrs_signup:10m rate=3r/m;

# The Wagtail admin uses inline scripts, so it gets no CSP (an empty value sends no header).
map $uri $lrs_csp {
    ~^/admin/ "";
    default "default-src 'self'; img-src 'self' https://i.ytimg.com data:; frame-src https://www.youtube-nocookie.com https://www.google.com/maps/; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
}

server {
    listen 443 ssl;
    server_name choir.tywynwebsites.co.uk;
    ssl_certificate /etc/letsencrypt/live/choir.tywynwebsites.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/choir.tywynwebsites.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 40m;
    # Headers are set here only: an add_header inside a location would drop all of these for it.
    # Preview only: the preview is open to everyone, so keep search engines from listing it as a copy of
    # the live site. Remove at switch-over.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $lrs_csp always;

    location /static/ {
        alias /var/www/lrs/app/static/;
        expires 1y;
    }
    # Only resized images are public. Originals (which may contain photo location data)
    # and documents are never served directly.
    location /media/images/ {
        alias /var/www/lrs/media/images/;
        expires 30d;
    }
    location /media/ { return 404; }
    # Files handed over by Django after its permission check (X-Accel-Redirect).
    location /protected/ {
        internal;
        alias /var/www/lrs/media/;
    }
    # Slow down password guessing, and reset-email floods (Gmail caps daily sending).
    location ~ ^/(admin/)?(login|password-reset|password_reset)/ {
        limit_req zone=lrs_login burst=5 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/lrs/gunicorn.sock;
    }
    location = /newsletters/ {
        limit_req zone=lrs_signup burst=3 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/lrs/gunicorn.sock;
    }
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/lrs/gunicorn.sock;
    }
}

server {
    listen 80;
    server_name choir.tywynwebsites.co.uk;
    # Let's Encrypt checks (certbot certonly --webroot -w /var/www/lrs/acme).
    location /.well-known/acme-challenge/ { root /var/www/lrs/acme; }
    location / { return 301 https://$host$request_uri; }
}
