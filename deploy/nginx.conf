# nginx site for the new LRS website (IONOS VPS). Replace example paths and server_name.
limit_req_zone $binary_remote_addr zone=lrs_login:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name www.example.org;
    # ssl_certificate / ssl_certificate_key: managed by certbot (Let's Encrypt)

    client_max_body_size 40m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /srv/lrs/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Only resized images are public. Originals (which may contain photo location data)
    # and documents are never served directly.
    location /media/images/ {
        alias /srv/lrs/media/images/;
        expires 30d;
    }
    location /media/ { return 404; }
    # Files handed over by Django after its permission check (X-Accel-Redirect).
    location /protected/ {
        internal;
        alias /srv/lrs/media/;
    }
    # Slow down password guessing.
    location ~ ^/(admin/)?login/ {
        limit_req zone=lrs_login burst=5 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn_lrs_new.sock;
    }
    location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://i.ytimg.com data:; frame-src https://www.youtube-nocookie.com; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn_lrs_new.sock;
    }
    # The Wagtail admin uses inline scripts, so it gets the standard headers without the strict CSP.
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn_lrs_new.sock;
    }
}

server {
    listen 80;
    server_name www.example.org;
    return 301 https://$host$request_uri;
}
